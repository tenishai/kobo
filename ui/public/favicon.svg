<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Kobo's mark: the same forge cross-peen hammer as the sidebar, on
       transparent, framed by an amber ring. Static colors (not CSS custom
       properties) since a favicon renders outside the app's own
       stylesheet.

       Glyph color: the original near-black ink (#262220) sat within a few
       RGB values of Chrome/Firefox's dark tab chrome (~#202124) and
       vanished on dark tabs (WCAG contrast ~1.02:1, indistinguishable
       from the background). #857d70, a warm mid-tone steel/taupe, reads on
       both: ~4.07:1 against white (#ffffff) and ~3.96:1 against dark tab
       chrome (#202124); both comfortably clear the 3:1 WCAG floor for
       non-text graphics, in each direction, instead of trading one
       background for the other. -->
  <circle cx="12" cy="12" r="10.5" fill="none" stroke="#b5651d" stroke-width="1.5" />
  <g fill="#857d70" transform="rotate(45 12 12)">
    <path d="M6.5 5.6 L13 3.5 L17.2 3.5 L17.2 7.7 L13 7.7 Z" />
    <rect x="10.6" y="7.4" width="2.8" height="9.6" rx="1.2" />
  </g>
</svg>
