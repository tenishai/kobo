<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Kobo's mark: a solid disc filling the canvas edge to edge (radius 12
       centered on 12,12, tangent to all four viewBox edges, no ring, no
       padding) with the hammer knocked out of it as negative space via
       fill-rule evenodd. Static hex (not a CSS custom property) since a
       favicon renders outside the app's own stylesheet.

       Disc color: #b5651d, the room's amber accent. Measured contrast
       (WCAG relative luminance), disc against each side the cutout can
       land on: about 4.34 to 1 against white (#ffffff), a plain light
       browser tab, and about 3.71 to 1 against #202124, the dark tab
       chrome Chrome and Firefox use. Both clear the 3 to 1 WCAG floor for
       non text graphics in each direction, so the disc itself stays
       visible whichever way a tab is themed, and the knocked out hammer
       (transparent, showing that same tab background) is by construction
       always distinct from the opaque amber around it. -->
  <path
    fill-rule="evenodd"
    fill="#b5651d"
    transform="rotate(45 12 12)"
    d="M 0 12 A 12 12 0 1 0 24 12 A 12 12 0 1 0 0 12 Z
       M 7.6 3.2 L 10.5 3.2 L 10.5 4.8 L 13.5 4.8 L 13.5 3.2 L 16.4 3.2
       A 1.3 1.3 0 0 1 17.7 4.5 L 17.7 6.7 A 1.3 1.3 0 0 1 16.4 8
       L 13.6 8 L 13.6 16 A 1.6 1.6 0 0 1 10.4 16 L 10.4 8 L 7.6 8
       A 1.3 1.3 0 0 1 6.3 6.7 L 6.3 4.5 A 1.3 1.3 0 0 1 7.6 3.2 Z"
  />
</svg>
