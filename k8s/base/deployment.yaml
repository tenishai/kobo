# Generated by Gojira. Sizing comes from the 'gateway' workload class —
# override in gojira.yaml with a justification, not here.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kobo
  labels:
    app.kubernetes.io/name: kobo
    gojira.dev/managed: "true"
    gojira.dev/class: gateway
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kobo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kobo
        gojira.dev/managed: "true"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: kobo
      securityContext:
        fsGroup: 1001
      nodeSelector:
        kubernetes.io/arch: arm64
        cloud.google.com/compute-class: "Scale-Out"
      tolerations:
        - { key: kubernetes.io/arch, operator: Equal, value: arm64, effect: NoSchedule }
      containers:
        - name: app
          image: gojira-app
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: KOBO_CONFIG
              value: "/config/config.yaml"
          volumeMounts:
            - name: data
              mountPath: /data
            - name: secret-kobo-config
              mountPath: /config/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: secret-kobo-github
              mountPath: /secrets/github/private-key.pem
              subPath: private-key.pem
              readOnly: true
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
              ephemeral-storage: 4Gi
            limits:
              cpu: 500m
              memory: 512Mi
              ephemeral-storage: 8Gi
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: kobo-data
        - name: secret-kobo-config
          secret:
            secretName: kobo-config
        - name: secret-kobo-github
          secret:
            secretName: kobo-github
