# The worker half of a split room: claims queued agents and runs their
# pipelines, serves no traffic. One replica; a second one only adds a second
# claimer, which the queue supports but nothing here needs.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
nameSuffix: -worker
patches:
  - path: patches/worker.yaml
