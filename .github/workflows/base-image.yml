name: base image

# kobo-base: the room's tools (git, gh, kubectl, gcloud) on the Python base, built
# on its own cadence so a release build does only the Python and UI layers. Runs on
# demand and when docker/base/ changes on main. Publishes
# ghcr.io/tenishai/kobo-base:<date>-<sha> (multi-arch) and prints the digest the
# product Dockerfile pins in its BASE_IMAGE default.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["docker/base/**", ".github/workflows/base-image.yml"]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/tenishai/kobo-base

jobs:
  image:
    name: multi-arch base image
    runs-on: ${{ fromJSON(vars.CI_BUILD_RUNS_ON || vars.CI_RUNS_ON || '"ubuntu-24.04"') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - id: name
        run: echo "tag=$(date -u +%Y%m%d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: docker/base
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ env.IMAGE }}:${{ steps.name.outputs.tag }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max

      - name: The pin for the product Dockerfile
        env:
          TAG: ${{ steps.name.outputs.tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "## kobo-base published" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "ARG BASE_IMAGE=${IMAGE}:${TAG}@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
