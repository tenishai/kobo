# kobo CI: the gates every change must pass. Tests only.
#
# The migration job exists because of a trap this room hit three times:
# a model change without a matching migration deploys cleanly and then
# crashloops on its first query. Here the chain runs against a real
# Postgres and schema_tripwire.py asserts the ORM maps nothing the chain
# never created.
#
# Every job runs on a GitHub-hosted runner, so a pull request from a fork gets
# the same checks as one from a branch. The last job, `ci`, is the one check the
# branch rules require. The image is built by release.yml when a release is cut.

name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:  # release.yml runs all of this on the tagged commit

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Three shards on three runners: `-n auto` on one runner is a six-minute run,
    # three make it two. Shard k takes every third test file.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    name: api-tests (${{ matrix.shard }}/3)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - name: Install (locked, py3.12)
        working-directory: api
        run: uv sync --locked --extra dev --python 3.12
      - name: Architecture cards are current
        # Each card pins the file it describes by blob sha; a seam that changed
        # without its card fails here (see AGENTS.md). Once is enough.
        if: ${{ matrix.shard == 1 }}
        working-directory: .
        run: uv run --project api --locked python scripts/check_arch_cards.py
      - name: No name this repository does not carry
        # Client and private product names, kept as hashes so the check never names them.
        if: ${{ matrix.shard == 1 }}
        working-directory: .
        run: python3 scripts/check_names.py
      - name: pytest
        working-directory: api
        # One worker per available core: the suite is CPU-bound and each test
        # owns its own SQLite file. The shard's files are every third test
        # file, sorted, so the split is stable across runs.
        run: |
          files=$(ls tests/test_*.py | sort | awk -v k=${{ matrix.shard }} 'NR % 3 == k - 1')
          PYTHONPATH=. .venv/bin/python -m pytest -q -n auto $files

  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install
        working-directory: ui
        run: npm ci
      - name: Build
        working-directory: ui
        run: npm run build
      - name: Typecheck
        working-directory: ui
        run: npm run check
      - name: Unit tests
        working-directory: ui
        timeout-minutes: 10
        run: npm test

  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kobo
          POSTGRES_PASSWORD: kobo
          POSTGRES_DB: kobo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kobo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_URL: postgresql+psycopg2://kobo:kobo@localhost:5432/kobo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - name: Install (locked, py3.12)
        working-directory: api
        run: uv sync --locked --python 3.12
      - name: Migration chain to head on real Postgres
        working-directory: api
        run: KOBO_DB_URL="$DB_URL" .venv/bin/alembic upgrade head
      - name: Schema tripwire (models ⊆ migrated schema)
        working-directory: api
        run: PYTHONPATH=. .venv/bin/python scripts/schema_tripwire.py "$DB_URL"

  test-lifecycle:
    # TESTING.md: a scaffold test drives a change and is deleted before the
    # change merges. The directories may exist on a branch; a pull request
    # that still carries a file in either does not merge.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: No scaffold tests past this point
        run: |
          left=$(find api/tests/scaffold ui/src/scaffold -type f 2>/dev/null || true)
          if [ -n "$left" ]; then
            echo "Scaffold tests must be deleted before merge (see TESTING.md):"
            echo "$left"
            exit 1
          fi
          echo "no scaffold tests"

  # The image is built only when a release is cut, so a Dockerfile mistake used to
  # surface at release time (0.3.4 published no image over an ARG declared after the
  # first FROM). BuildKit's --check lints both Dockerfiles without building anything.
  dockerfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read  # the check resolves the private base image's metadata on ghcr
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Lint the product Dockerfile
        run: docker buildx build --check .
      - name: Lint the base Dockerfile
        run: docker buildx build --check docker/base

  # The one check the branch rules require: it passes only when every job above passed.
  # A skipped or cancelled job fails it, so nothing merges on a job that did not run.
  ci:
    name: ci
    if: ${{ always() }}
    needs: [api-tests, ui, migrations, test-lifecycle, dockerfile]
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            [ "$r" = "success" ] || { echo "a job did not pass: $RESULTS"; exit 1; }
          done
