[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kobo-api"
version = "0.1.0"
description = "Kobo API — the agent assembly room backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "sqlalchemy>=2",
    "pydantic>=2",
    "pyyaml",
    "httpx",
    "jsonschema",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["kobo_api"]

[tool.ruff.lint.per-file-ignores]
# conftest.py's shared fixtures import init_db per the P1a task-1 brief even
# though this task's fixtures don't call it directly (later tasks' tests do).
"tests/conftest.py" = ["F401"]
