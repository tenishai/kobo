[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kobo-api"
version = "0.1.0"
description = "Kobo API — the agent assembly room backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "sqlalchemy>=2",
    "pydantic>=2",
    "pyyaml",
    "httpx",
    "jsonschema",
    "PyJWT[crypto]",
    # POST /oauth/token (Task 4) is form-encoded per RFC 6749 -- FastAPI's
    # Form(...) parameters need this even for plain urlencoded bodies (not
    # just multipart/form-data), on the FastAPI/Starlette versions pinned
    # here.
    "python-multipart",
    # The official Model Context Protocol Python SDK (MCP server arc, Task 6
    # onward): Task 6 needs it for the real `ToolError` the audit decorator
    # raises on a rate-limited call; Task 7 needs it for the server itself.
    # PINNED BELOW 2.0: mcp 2.0.0 restructured `mcp.server.fastmcp` ->
    # `mcp.server.mcpserver` and renamed `FastMCP` -> `MCPServer`. This arc's
    # spec, plan, and the proven reference architecture it follows are all
    # written against the 1.x `fastmcp` surface (FastMCP, TokenVerifier,
    # streamable_http_app, the 308/lifespan gotchas). 1.29.0 carries that
    # surface intact; adopting 2.0's rename would discard every verified
    # gotcha for an unproven API. Revisit as its own arc if 2.x is wanted.
    "mcp>=1.15,<2",
    # Resilience arc (Task 11): the schema used to evolve by `create_all`
    # plus a hand-written `ALTER TABLE` run by an operator -- alembic is the
    # migration path a real Postgres deployment needs; SQLite stays on
    # `create_all` for local dev and tests (kobo_api.db.init_db), unchanged.
    "alembic",
    # Resilience arc (Task 12): the Postgres driver `sqlalchemy.create_engine`
    # needs whenever `db_url` names a `postgresql(+psycopg2)://` scheme --
    # SQLite (the default) needs no driver of its own beyond stdlib sqlite3.
    "psycopg2-binary",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["kobo_api"]

[tool.ruff.lint.per-file-ignores]
# conftest.py's shared fixtures import init_db per the P1a task-1 brief even
# though this task's fixtures don't call it directly (later tasks' tests do).
"tests/conftest.py" = ["F401"]
