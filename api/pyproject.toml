[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kobo-api"
version = "0.1.0"
description = "Kobo API — the agent assembly room backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "sqlalchemy>=2",
    "pydantic>=2",
    "pyyaml",
    "httpx",
    "jsonschema",
    "PyJWT[crypto]",
    # POST /oauth/token (Task 4) is form-encoded per RFC 6749 -- FastAPI's
    # Form(...) parameters need this even for plain urlencoded bodies (not
    # just multipart/form-data), on the FastAPI/Starlette versions pinned
    # here.
    "python-multipart",
    # The official Model Context Protocol Python SDK (MCP server arc, Task 6
    # onward): Task 6 needs it for the real `ToolError` the audit decorator
    # raises on a rate-limited call; Task 7 needs it for the server itself.
    # NOTE: the version resolved here (2.0.0 at the time Task 6 landed)
    # restructured `mcp.server.fastmcp` -> `mcp.server.mcpserver` and
    # renamed `FastMCP` -> `MCPServer`, which the MCP server arc's own
    # design doc still writes against the older `fastmcp` names -- Task 7's
    # implementer needs to reconcile that drift, not assume the doc's
    # import paths are current.
    "mcp>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["kobo_api"]

[tool.ruff.lint.per-file-ignores]
# conftest.py's shared fixtures import init_db per the P1a task-1 brief even
# though this task's fixtures don't call it directly (later tasks' tests do).
"tests/conftest.py" = ["F401"]
