# Copy to config.local.yaml (gitignored) and fill in real values, or point
# CORTEX_CONFIG at a file with this shape. Any field omitted falls back to
# the default baked into cortex_api.config.Config.

# GitHub organization containing agent implementations
github_org: example-org

# OCI image URI for the daedalus runtime executor
runtime_image: registry.example/agents/daedalus-runtime:latest

# Base URL of the Gojira agent orchestrator service
gojira_url: http://127.0.0.1:8080

# API token for Gojira authentication (null for local dev without auth)
gojira_token: null

# Kubernetes cluster name where Gojira is deployed
#
# P0 finding: the platform's cluster registration (its own `ar_repo` field,
# not set here) must be the FULL Artifact Registry path
# (<location>-docker.pkg.dev/<project>/<repo>), never the short repo name —
# a short name produced a confusing empty-arg gcloud failure at image-push
# time. Not cortex's config to hold, but worth the reminder here since this
# cluster name is what ties an agent's onboarding to that registration.
gojira_cluster: example-cluster

# GCP project ID for infrastructure and resources
gcp_project: example-project

# GCP project ID for Vertex AI models
vertex_project: example-model-project

# Google Cloud region for Vertex AI endpoints
vertex_location: us-east5

# Email group managing LLM model access and routing
model_group: models@example.com

# Model garden model used to generate agent avatar PNGs
avatar_model: gemini-2.5-flash-image

# Google Cloud region for the avatar image-generation endpoint (project is
# shared with vertex_project above)
avatar_location: us-central1

# Available LLM models with display labels for UI selection
models:
  - id: vertex_ai/claude-sonnet-4-5
    label: Claude Sonnet 4.5

# Local or remote path to skills repository (null uses package defaults)
skills_repo_path: null

# Directory containing agent persona definitions (null uses package templates)
personas_dir: null

# Local directory for persistent runtime state and cache
workdir: ~/.cortex

# Database connection URL (supports sqlite, postgresql, etc)
db_url: sqlite:///cortex.db

# Path to a gitignored YAML file holding the Slack app-config token pair
# (slack_app_config_token / slack_app_config_refresh_token) used to create
# Slack apps from a manifest. Optional: when unset, Slack connect features
# 503 with "Slack is not configured" rather than failing to start. NEVER put
# real token values in this (or any tracked) file.
slack_tokens_path: null
