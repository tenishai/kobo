# Copy to config.local.yaml (gitignored) and fill in real values, or point
# KOBO_CONFIG at a file with this shape. Any field omitted falls back to
# the default baked into kobo_api.config.Config.

# --- Container deployment, at a glance -------------------------------------
# The container image (repo-root Dockerfile) bakes no config and no secrets;
# this file (or one shaped like it) arrives at runtime via a mounted file
# referenced by the KOBO_CONFIG env var. The keys most relevant to running
# kobo as that container, gathered here for reference — each still lives at
# its own place below, values are unchanged:
#   ui_dist              -> set to /srv/ui, where the image's build stage
#                            copies the built UI (see "ui_dist" below).
#   iap_audience         -> set when an identity-aware proxy sits in front
#                            of the deployed container (see "iap_audience").
#   github_app_id
#   github_app_installation_id
#   github_app_private_key_path
#                        -> set together to authenticate as a GitHub App
#                           instead of the ambient `gh auth` session that
#                           dev relies on (see the github_app_* keys below;
#                           the private key path should point at a mounted
#                           Secret, never a baked-in file).
#   db_url               -> point this at a path on a mounted volume (e.g.
#                           sqlite:////data/kobo.db) so state survives
#                           container restarts (see "db_url" below).
# -----------------------------------------------------------------------------

# GitHub organization containing agent implementations
github_org: example-org

# Full name (owner/repo) of the client's org config repo (kobo-config).
# Cloned at boot and its org.yaml merged over this file's own values (see
# kobo_api.org.load_org_config) — null means no org config repo is
# configured, and kobo runs on this file's values alone.
org_repo: null

# OCI image URI for the daedalus runtime executor
runtime_image: registry.example/agents/daedalus-runtime:latest

# Base URL of the Gojira agent orchestrator service
gojira_url: http://127.0.0.1:8080

# API token for Gojira authentication (null for local dev without auth)
gojira_token: null

# Kubernetes cluster name where Gojira is deployed
#
# P0 finding: the platform's cluster registration (its own `ar_repo` field,
# not set here) must be the FULL Artifact Registry path
# (<location>-docker.pkg.dev/<project>/<repo>), never the short repo name —
# a short name produced a confusing empty-arg gcloud failure at image-push
# time. Not kobo's config to hold, but worth the reminder here since this
# cluster name is what ties an agent's onboarding to that registration.
gojira_cluster: example-cluster

# GCP project ID for infrastructure and resources
gcp_project: example-project

# GCP project ID for Vertex AI models
vertex_project: example-model-project

# Google Cloud region for Vertex AI endpoints
vertex_location: us-east5

# Email group managing LLM model access and routing
model_group: models@example.com

# Model garden model used to generate agent avatar PNGs
avatar_model: gemini-2.5-flash-image

# Google Cloud region for the avatar image-generation endpoint (project is
# shared with vertex_project above)
avatar_location: us-central1

# Model garden model used to generate agent name suggestions (create flow
# v2 addendum)
name_model: gemini-2.5-flash

# Google Cloud region for the name-suggestion text endpoint (project is
# shared with vertex_project above)
name_location: us-central1

# Available LLM models with display labels for UI selection
models:
  - id: vertex_ai/claude-sonnet-4-5
    label: Claude Sonnet 4.5

# Bare repo name (e.g., "skills", not "owner/skills") of the org's skills
# repo (its own publish pipeline, if any, populates the bucket below — kobo
# itself never clones it) — kobo prefixes it with github_org for every
# GitHub operation. GCS buckets kobo-api actually reads the skills/personas
# catalogs from (Task 5) — empty string means unconfigured for all three.
skills_repo: null
skills_bucket: ""
personas_bucket: ""

# Workload Identity Federation provider + service account the org's own
# skills-publish pipeline (if any) runs as. skills_publish_external true
# means that pipeline is external to kobo — kobo must never install or
# modify anything in the skills repo itself.
skills_publish_wif_provider: ""
skills_publish_service_account: ""
skills_publish_external: false

# Base URL of the switchboard (cabal) service the room registers agents
# with and (once wired) relays chat through, and the template for an
# agent's in-cluster a2a endpoint (a literal "{name}" placeholder the
# directory sync fills in). Both null means the switchboard integration is
# off - kobo runs the legacy direct-to-agent paths unchanged. The operator
# token itself comes from the CABAL_OPERATOR_TOKEN env var, never from
# this file.
cabal_url: null
agent_endpoint_template: null

# Base URL this kobo API instance is reachable at (bootstrap CLI / org
# status, Task 3+) — describes this machine, not anything org-supplied.
api_base_url: http://127.0.0.1:8100

# Local directory for persistent runtime state and cache
workdir: ~/.kobo

# Database connection URL (supports sqlite, postgresql, etc)
db_url: sqlite:///kobo.db

# Path to a gitignored YAML file holding the Slack app-config token pair
# (slack_app_config_token / slack_app_config_refresh_token) used to create
# Slack apps from a manifest. Optional: when unset, Slack connect features
# 503 with "Slack is not configured" rather than failing to start. NEVER put
# real token values in this (or any tracked) file.
slack_tokens_path: null

# Emails allowed to use the Slack connect routes once IAP is enabled (see
# iap_audience below) — everyone else gets a 403. Empty (the default) leaves
# Slack connect open to anyone who can reach this room, matching today's
# behavior.
# slack_operators: [ops@example.com]

# Emails allowed to destroy an agent (DELETE /api/agents/{name}) once IAP is
# enabled (see iap_audience below) — everyone else gets a 403. Empty (the
# default) leaves destruction open to anyone who can reach this room,
# matching today's behavior.
# operators: [ops@example.com]

# Names from `groups` below whose members hold operator status room-wide
# (full visibility, every owner-or-operator gate passes, invites on any
# side) once IAP is enabled -- resolved through the directory, same as
# `groups`. Empty (the default) means no group has admin standing; the
# `operators` list above still works on its own either way. Every entry
# here must also be a name in `groups`, or the room fails to start.
# Removing someone from the backing directory group can take up to the
# resolver's cache TTL (900s default) to take effect here. Keep at least
# one `operators` email set as break-glass, since a directory outage takes
# group-based admin status down with it.
# admin_groups: [infra-engineering]

# Path to a built UI dist/ directory (e.g. ui/dist from `npm run build`) to
# serve alongside the API on the same origin, no CORS. Unset (the default)
# means dev: the API runs alone and the UI runs separately via its own dev
# server, proxying /api.
ui_dist: null

# The audience string your identity proxy signs its assertions for. When
# set, every request (API and UI alike) must carry a verified
# `x-goog-iap-jwt-assertion` header naming this audience, or the app answers
# 401 before the request reaches any route. Empty (the default) disables
# verification entirely — the unauthenticated local dev setup.
iap_audience: ""

# GitHub App identity kobo authenticates as when deployed, instead of
# borrowing the operator's ambient `gh auth` session (dev's only mode
# today, and what you get when any of the three fields below is left
# empty/unset). All three must be set together to switch GhCLI's git/gh
# calls over to a minted installation token.
github_app_id: ""
github_app_installation_id: ""

# Path to the App's PEM-encoded private key. Read lazily on first token
# mint; never logged. NEVER put a real private key in a tracked file —
# point this at a gitignored path (or a mounted Secret, deployed).
github_app_private_key_path: null
