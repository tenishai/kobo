[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os

# The real target URL is resolved at runtime by migrations/env.py, from the
# same Config.db_url the app itself connects with (or the KOBO_DB_URL
# override for a one-off run). Left blank here on purpose: a value baked
# into this file would drift from whatever the room is actually configured
# for the moment either one changed without the other.
sqlalchemy.url =

[post_write_hooks]

# No [loggers]/[handlers]/[formatters] sections: migrations/env.py
# deliberately never calls logging.config.fileConfig() against this file
# (see that module's own comment for why -- it clobbers the caller's
# process-global logging config, which broke pytest's caplog fixture for
# every other test module when this room's migration tests invoke alembic
# in-process). Alembic's own log statements fall back to whatever logging
# configuration the caller already has.
